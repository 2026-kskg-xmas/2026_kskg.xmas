<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hang a Wish on a Star</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 純粹的深藍星夜背景 -->
    <div class="starry-sky"></div>

    <!-- 頂部大標題區 -->
    <header class="hero-header">
        <h1 class="main-title">Hang a Wish on a Star</h1>
        
        <!-- 工具列：搜尋框 + 寫下願望按鈕 -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 搜尋暱稱或願望關鍵字...">
            </div>
            <button id="open-write-btn" class="star-btn">✨ 寫下願望</button>
        </div>
    </header>

    <!-- 主要祈福牆：長線與木夾紙卡區（由 JS 動態生成） -->
    <main id="wish-lines-container" class="wish-lines-container"></main>

    <!-- 分頁導覽列（由 JS 動態生成） -->
    <nav id="pagination-bar" class="pagination-bar" aria-label="願望分頁"></nav>

    <!-- 網頁最下方：極簡管理員鎖頭圖示 -->
    <footer class="site-footer">
        <button id="admin-lock-btn" class="lock-icon-btn" aria-label="管理員模式">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </button>
    </footer>

    <!-- 彈窗 1：寫下願望 -->
    <div id="write-modal" class="modal-backdrop hidden">
        <div class="modal-box">
            <button id="close-write-btn" class="modal-close">&times;</button>
            <h2>✨ 掛上你的星光願望</h2>
            <form id="wish-form">
                <input type="text" id="wish-author-input" placeholder="你的暱稱（若留白則為匿名星光）" maxlength="15">
                <textarea id="wish-content-input" rows="4" placeholder="寫下你想說的話或祝福..." required maxlength="100"></textarea>
                <button type="submit" class="star-btn full-width">夾上星夜長線</button>
            </form>
        </div>
    </div>

    <!-- 彈窗 2：管理員密碼驗證 -->
    <div id="admin-modal" class="modal-backdrop hidden">
        <div class="modal-box small-box">
            <button id="close-admin-btn" class="modal-close">&times;</button>
            <h3>🔒 管理員驗證</h3>
            <form id="admin-login-form">
                <input type="password" id="admin-pwd-input" placeholder="請輸入管理員密碼" required>
                <p id="pwd-error-msg" class="error-text hidden">密碼錯誤，請再試一次</p>
                <button type="submit" class="star-btn full-width">確認解鎖</button>
            </form>
        </div>
    </div>

    <!-- 彈窗 3：管理員編輯留言 -->
    <div id="edit-modal" class="modal-backdrop hidden">
        <div class="modal-box">
            <button id="close-edit-btn" class="modal-close">&times;</button>
            <h2>✏️ 編輯願望內容</h2>
            <form id="edit-form">
                <input type="text" id="edit-author-input" placeholder="暱稱" maxlength="15" required>
                <textarea id="edit-content-input" rows="4" placeholder="願望內容..." required maxlength="100"></textarea>
                <button type="submit" class="star-btn full-width">儲存修改</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
